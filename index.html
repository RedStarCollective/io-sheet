<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Iō Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Chakra+Petch:wght@600;700&family=Oxanium:wght@500;600;700&family=Rajdhani:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&text=%E5%9C%9F%E7%81%AB%E6%B0%B4%E9%A3%8E&display=swap">
<style>
:root{
  color-scheme: dark;
  --void:#080605;
  --panel:#110d0c;
  --cell:#1c1716;
  --cell-2:#26201e;
  --line:#352d2a;
  --frame:#6b5431;
  --hdr:#000;
  --red:#9f0c17;
  --red-dim:#4f0a10;
  --red-hi:#d11c28;
  --gold:#b58f52;
  --gold-dim:#6f5a3a;
  --ink:#f0ebe3;
  --ink-2:#c1b8b2;
  --ink-3:#7e746f;
  --fire:#ff8a3d;
  --ice:#7cc8f2;
  --volt:#8f9dff;
  --med:#4cc37a;
  --earth:#c49a5a;
  --water:#4f9fe0;
  --air:#cfd8e3;
  --f-disp:"Chakra Petch","Rajdhani","Arial Narrow",sans-serif;
  --f-brush:"Ma Shan Zheng","KaiTi","STKaiti","Noto Serif SC",serif;
  --f-body:"Rajdhani","Arial Narrow","Helvetica Neue",sans-serif;
  --f-cond:"Barlow Condensed","Rajdhani","Arial Narrow",sans-serif;
  --f-num:"Oxanium","Rajdhani",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:15px;font-weight:500;line-height:1.25;min-height:100%}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
.wrap{position:relative;z-index:1}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px)}
.wrap{max-width:1560px;margin:0 auto;padding-inline:20px;padding-block:18px 48px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{background:var(--frame);padding:2px;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%)}
.topin{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:stretch;background:rgba(17,13,12,.78);clip-path:polygon(0 0,calc(100% - 21px) 0,100% 21px,100% 100%,0 100%)}
.id{display:flex;align-items:center;gap:14px;padding:12px 22px 12px 14px;background:linear-gradient(90deg,rgba(159,12,23,.25),transparent);border-right:2px solid var(--frame)}
.star{width:40px;height:40px;flex:none}
.id small{display:block;font-weight:700;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.id h1{transition:text-shadow .12s;margin:2px 0 6px;font-family:var(--f-disp);font-weight:700;font-size:46px;line-height:.9;letter-spacing:.03em}
.id h1:hover{text-shadow:-2px 0 rgba(255,24,60,.85),2px 0 rgba(0,229,255,.75)}
.chip{display:inline-block;border:1px solid var(--gold-dim);color:var(--gold);padding:2px 8px 1px;font-weight:700;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase}
.meta{display:flex;flex-wrap:wrap;align-items:stretch;min-width:0}
.m{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:10px 20px;border-right:1px solid var(--line)}
.m b{font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.m span{font-family:var(--f-num);font-size:24px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.m .gold{color:var(--ink)}
.u{font-family:var(--f-body);font-size:13px;color:var(--ink-3);font-weight:600;margin-left:3px}
.code{flex:1;min-width:150px;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:10px 20px}
.code{align-items:flex-start}
.sin-row{display:flex;align-items:stretch;gap:10px}
.sin-tag{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;font-size:10px;letter-spacing:.2em;color:var(--void);background:var(--ink-2);padding:3px 2px;text-align:center}
.bc{display:block;height:34px;width:230px;max-width:100%}
.bc rect{fill:var(--ink-2)}
.sin-num{font-family:var(--f-num);font-size:12px;font-weight:500;letter-spacing:.32em;color:var(--ink-2);margin-top:4px}
.sin-sub{font-weight:600;font-size:10px;letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase}
.top .actions{padding:10px 30px 10px 14px}
.actions{display:flex;gap:10px;align-items:center}
.btn{background:transparent;border:1px solid var(--line);padding:7px 16px;font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.save-state{font-size:13px;font-weight:600;color:var(--ink-3);letter-spacing:.06em}
.tabrow{display:flex;align-items:center;gap:16px;margin:12px 0 16px}
.tabrow .tabs{margin:0;flex:1;min-width:0}
.tabrow .save-state{flex:none;margin-left:auto;padding-right:4px;font-size:12px;letter-spacing:.1em;white-space:nowrap}
@media (max-width:600px){ .tabrow{flex-wrap:wrap;gap:4px} .tabrow .save-state{order:-1;flex-basis:100%;text-align:right} }

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;overflow-x:auto;margin:12px 0 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{transition:text-shadow .12s;flex:none;padding:8px 16px 7px;font-weight:700;font-size:13.5px;letter-spacing:.16em;text-transform:uppercase;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--ink-3)}
.tab[aria-current="page"]{color:#fff;background:var(--red);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.tab .soon{font-size:10px;letter-spacing:.06em;color:var(--red-dim);margin-left:6px}

/* ---------- boxes: official-sheet frame + black header bar ---------- */
.box{background:rgba(17,13,12,.74);border:2px solid var(--frame);display:flex;flex-direction:column;min-width:0}
.hb{position:relative;display:flex;align-items:center;gap:8px;background:var(--hdr);color:#fff;padding:5px 16px 4px 9px;font-weight:700;font-size:14px;letter-spacing:.03em}
.hb::after{content:"";position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 11px 11px 0;border-color:transparent var(--frame) transparent transparent}
.hb .sp{flex:1}
.hb .c{width:30px;text-align:center;font-size:11.5px;letter-spacing:.06em;color:#fff}
.lab{font-weight:700;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- dossier grid ---------- */
.dossier{display:grid;grid-template-columns:340px 92px repeat(3,minmax(0,1fr));gap:12px;
  grid-template-areas:"id st c1 c2 c3" "vit vit wa wa wa" "lo lo lo lo lo"}
.a-id{grid-area:id}.a-st{grid-area:st}.a-c1{grid-area:c1}.a-c2{grid-area:c2}.a-c3{grid-area:c3}.a-vit{grid-area:vit}.a-wa{grid-area:wa}.a-lo{grid-area:lo}

.idcol{display:flex;flex-direction:column;gap:12px}
.portrait{flex:1;min-height:300px;margin:0;background:#000;overflow:hidden;position:relative;border:2px solid var(--frame)}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.idtab{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.idtab .h{grid-column:1/-1;background:var(--hdr);text-align:center;padding:4px 6px 3px;font-weight:700;font-size:13.5px}
.idtab .v{padding:4px 6px;text-align:center;border-right:1px solid var(--line);background:var(--cell);font-size:14px;color:var(--ink-2)}
.idtab .v:nth-child(4),.idtab .v:last-child{border-right:0}
.idtab .v.full{grid-column:1/-1;font-size:17px;font-weight:700;color:var(--ink);border-right:0}
.idtab .v.rank{font-family:var(--f-num);font-size:20px;font-weight:600;color:var(--ink)}
.idtab .v.small{font-size:12.5px;line-height:1.1}
.hum{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;background:var(--cell)}
.hum .n{display:grid;place-items:center;font-family:var(--f-num);font-size:30px;font-weight:600;padding:4px 0}
.of{writing-mode:vertical-rl;transform:rotate(180deg);background:var(--red);color:#fff;font-weight:700;font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:grid;place-items:center;padding:0 2px}

/* stats rail */
.stats{display:flex;flex-direction:column;gap:6px}
.stat{flex:1;display:flex;flex-direction:column;border:2px solid var(--frame);background:var(--cell);min-height:58px}
.stat b{display:block;background:var(--hdr);text-align:center;font-weight:700;font-size:13.5px;letter-spacing:.08em;padding:2px 0 1px}
.stat .sv{flex:1;display:grid;place-items:center;font-family:var(--f-num);font-size:28px;font-weight:600;line-height:1}
.stat .pair{flex:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch}
.stat .pair span:not(.of){display:grid;place-items:center;font-family:var(--f-num);font-size:22px;font-weight:600}

/* skills */
.skcol{display:flex;flex-direction:column;gap:10px;min-width:0;align-self:start}

.hb .tog{color:#fff;font-weight:700}
.hb .tog .cnt{color:var(--gold)}
.sk{width:100%;border-collapse:collapse}
.sk td{padding:2px 0;height:23px;width:30px;text-align:center;font-size:14.5px;font-weight:600;color:var(--ink-3);border-top:1px solid var(--line);font-variant-numeric:tabular-nums;width:34px}
.sk td:first-child{width:auto;text-align:left;padding-left:9px;font-family:var(--f-cond);font-weight:500;font-size:15.5px;color:var(--ink-2);line-height:1.1}
.sk td.base{color:var(--ink)}
.sk tr.key td:first-child{color:var(--ink);font-weight:600}
.sk tr.zero td:first-child{color:var(--ink-3)}
.sk tr.sub td{background:var(--cell-2);color:var(--ink-2);font-weight:600}
.sk tr.sub .cnt.known{margin-left:auto;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--gold-dim);text-transform:uppercase}
.sk tr.more td{padding-top:2px;padding-bottom:2px}
.sk tr.more .tog{padding-left:16px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.sk tr.more .tog:hover{color:var(--ink)}
.sk tr.more .chev{font-size:8px;color:var(--red-hi)}
.sk tr.more .tog[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sk tr.kind td{padding-left:34px;color:var(--ink-2);font-family:var(--f-cond);font-size:14px}
.sk tr.kind td::before{content:"↳ ";color:var(--red-hi)}

.sk tr.ind td:first-child{padding-left:26px;position:relative}
.sk tr.ind td:first-child::before{content:"↳";position:absolute;left:10px;top:50%;transform:translateY(-52%);color:var(--red-hi);font-weight:700}
.st{font-weight:700;color:var(--ink-3);font-size:.86em;letter-spacing:.03em}
tr.key .st{color:var(--ink-2)}
.bt{font-style:italic;color:var(--ink-3);font-size:.88em}
.t .tags,.t .pn{display:block;font-family:var(--f-body);font-size:12.5px;line-height:1.2;margin-top:1px;font-weight:500}
.t .tags .bt{font-size:1em}
.t .pn{color:var(--ink-3);font-style:normal}
body:not(.editing) .t td.name > .flex{display:block}
.tog{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;width:100%}
.tog .chev{display:inline-block;color:var(--red-hi);font-size:11px;transition:transform .15s}
.tog[aria-expanded="true"] .chev{transform:rotate(90deg)}
.tog .cnt{margin-left:auto;margin-right:8px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--gold-dim);text-transform:uppercase}
.mname{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
.sk tr.mhead td{font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);background:linear-gradient(90deg,rgba(181,143,82,.16),transparent 80%);padding-left:12px;height:20px}
.sk tr.mhead.other td{color:var(--ink-3);background:transparent;border-top:1px solid var(--frame)}
.sk tr.master td:first-child,.sk tr.iconrow td:first-child{padding-left:12px}
.sk tr.master td:first-child::before,.sk tr.iconrow td:first-child::before{display:none}
.gi{width:19px;height:19px;flex:none;color:#9a7b48}
.sk tr:hover .gi{color:var(--gold)}
.sk tr.master td{height:30px}
.sk tr.master td:first-child{font-weight:600;color:var(--ink);box-shadow:inset 3px 0 0 var(--mc)}
.sk tr.master td:first-child::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-conic-gradient(var(--mc) 0 25%,transparent 0 50%) 0 0/4px 4px;opacity:.13;
  -webkit-mask-image:linear-gradient(90deg,#000,transparent 75%);mask-image:linear-gradient(90deg,#000,transparent 75%)}
.sk tr.master td.base{color:var(--mc)}
.sk tr.master td{height:30px}
.m-earth{--mc:var(--earth)}.m-fire{--mc:var(--fire)}.m-water{--mc:var(--water)}.m-air{--mc:var(--air)}
.sk tr.master .elc{margin-right:0}
.elc{display:inline-block;width:1.25em;margin-right:4px;font-family:var(--f-brush);font-size:18px;line-height:1;text-align:center;vertical-align:-2px;text-shadow:0 0 8px currentColor}
.el-earth{color:var(--earth)}.el-fire{color:var(--fire)}.el-water{color:var(--water)}.el-air{color:var(--air)}

/* vitals */
.vit{align-self:start}
.cond{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.cond > div + div{border-left:1px solid var(--line)}
.cond .sub2{background:var(--cell-2);padding:4px 9px;font-weight:700;font-size:13px;text-align:center}
.hp{display:grid;grid-template-columns:1fr auto 1fr;background:var(--cell)}
.hp .n{display:grid;place-items:center;font-family:var(--f-num);font-size:28px;font-weight:600;padding:6px 0}
.rowkv{display:grid;grid-template-columns:1fr 64px;border-top:1px solid var(--line)}
.rowkv > div{padding:6px 9px}
.rowkv .k{font-weight:700;font-size:14px;line-height:1.1;display:flex;align-items:center}
.rowkv .val{display:grid;place-items:center;font-family:var(--f-num);font-size:24px;font-weight:600;background:var(--cell)}
.wnote{padding:6px 9px;border-top:1px solid var(--line);text-align:center;font-weight:700;font-size:13px;color:var(--ink-2)}
.crit{padding:5px 9px;border-top:1px solid var(--line);font-family:var(--f-cond);font-size:15.5px}
.crit:first-child{border-top:0}
.empty{padding:8px 9px;color:var(--ink-3);font-size:13.5px}

/* weapons & armor */
.wa{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.35fr) minmax(0,.75fr);gap:12px;align-items:start}
.sec-title{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:6px 0 -2px;font-family:var(--f-disp);font-weight:700;font-size:21px;letter-spacing:.06em;text-transform:uppercase}
.sec-title::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--frame),transparent)}
.glx{transition:text-shadow .12s}
.glx:hover,.tab:hover{text-shadow:-2px 0 rgba(255,24,60,.85),2px 0 rgba(0,229,255,.75)}
.span2{grid-column:span 2}
.tbl-wrap{overflow-x:auto}
.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.t td{padding:5px 9px;border-top:1px solid var(--line);font-size:14.5px;color:var(--ink-2);vertical-align:middle}
.t td.name{color:var(--ink);font-family:var(--f-cond);font-size:15.5px}
.t td.n{text-align:center;font-weight:600;color:var(--ink);width:48px}
.t td.dmg{color:var(--ink);white-space:nowrap}
.t tr.ind td.name{padding-left:24px;position:relative}
.t tr.ind td.name::before{content:"↳";position:absolute;left:9px;color:var(--red-hi);font-weight:700}
.tn{font-weight:700;letter-spacing:.04em}
.ico{display:inline-block;width:17px;height:17px;vertical-align:-3px;margin-right:5px;flex:none}
.tone-gold .tn{color:#d9b46a;text-shadow:0 0 8px rgba(217,180,106,.35)}
.tone-fire .tn{background:linear-gradient(0deg,#ff4d1a,#ffb347 55%,#ffe29a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 4px rgba(255,110,40,.55))}
.tone-ice .tn{background:linear-gradient(100deg,#bfeaff,#ffffff 45%,#7cc8f2);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 4px rgba(124,200,242,.5))}
.tone-volt .tn{color:#c9d0ff;text-shadow:0 0 6px rgba(143,157,255,.8),0 0 14px rgba(143,157,255,.35)}
.tone-med .tn{color:var(--med)}
.t tr.row-fire td.name{background:linear-gradient(90deg,rgba(255,90,30,.10),transparent 95%)}
.t tr.row-ice td.name{background:linear-gradient(90deg,rgba(124,200,242,.09),transparent 95%)}
.t tr.row-volt td.name{background:linear-gradient(90deg,rgba(143,157,255,.10),transparent 95%)}
.t tr.row-gold td.name{background:linear-gradient(90deg,rgba(217,180,106,.08),transparent 95%)}
@media (prefers-reduced-motion:no-preference){
  .tone-fire .ico{animation:flick 1.6s infinite}
  @keyframes flick{0%,100%{transform:scale(1) rotate(0);filter:drop-shadow(0 0 3px #ff6a1f)}30%{transform:scale(1.06,.96) rotate(-3deg)}55%{transform:scale(.96,1.07) rotate(2deg);filter:drop-shadow(0 0 6px #ff9a3f)}80%{transform:scale(1.03) rotate(-1deg)}}
  .tone-ice .tn{animation:frost 5s linear infinite}
  @keyframes frost{from{background-position:200% 0}to{background-position:-200% 0}}
  .tone-ice .ico{animation:spinslow 14s linear infinite}
  @keyframes spinslow{to{transform:rotate(360deg)}}
  .tone-volt .tn,.tone-volt .ico{animation:zap 3.8s infinite}
  @keyframes zap{0%,86%,100%{opacity:1;filter:none}87%{opacity:.35}88%{opacity:1;filter:brightness(1.8)}90%{opacity:.5}91%{opacity:1;filter:brightness(2.2)}93%{filter:none}}
}
.pen{padding:6px 9px;text-align:center;font-weight:700;font-size:13px;color:var(--ink-2);border-top:1px solid var(--line)}
.glitch{margin:0;background:#000}
.glitch img{width:100%;display:block;aspect-ratio:320/336;object-fit:cover}
.glitch figcaption{padding:8px 9px 9px;border-top:1px solid var(--line)}
.aka{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.aka span{font-family:var(--f-cond);font-size:14px;color:var(--ink-2);background:var(--cell);border:1px solid var(--line);border-left:2px solid var(--red);padding:1px 7px}

/* loadout */
.lo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 9px;min-height:27px;border-top:1px solid var(--line);font-family:var(--f-cond);font-size:15.5px;color:var(--ink-2)}
.list li:first-child{border-top:0}
.list li .q{font-weight:600;color:var(--ink)}
.list li.sub{background:var(--cell-2);color:var(--ink);font-weight:700;font-size:13.5px}
.list li .where{color:var(--ink-3);font-size:13.5px;text-align:right}
.stack{display:flex;flex-direction:column;gap:12px}
.ctr{display:inline-flex;align-items:center;border:1px solid var(--line);flex:none}
.ctr button{width:26px;height:23px;border:0;background:var(--cell);cursor:pointer;font-size:16px;font-weight:700;color:var(--ink-2);line-height:1}
.ctr button:hover{background:var(--red-dim);color:#fff}
.ctr button:disabled{opacity:.35;cursor:default;background:var(--cell)}
.ctr output{min-width:30px;text-align:center;font-weight:600;color:var(--ink)}
.ctr output.out{color:var(--red-hi)}

@media (hover:hover){
  .sk tbody tr:not(.sub):hover td,.t tbody tr:hover td,.list li:not(.sub):hover{background:rgba(209,28,40,.12)}
  .sk tbody tr:not(.sub):hover td:first-child{color:var(--ink)}
}
/* ---------- edit mode ---------- */

.wi.wsub::before{content:"↳";position:absolute;left:8px;top:6px;color:var(--red-hi);font-weight:700}
.wh{display:flex;flex-wrap:wrap;align-items:center;gap:4px 5px}
.wn{font-family:var(--f-cond);font-size:16px;font-weight:600;color:var(--ink);line-height:1.1;margin-right:2px}
.wd{margin:3px 0 0;font-size:13.5px;line-height:1.3;color:var(--ink-2)}
.wd .bt{font-style:normal}
.chip2{font-family:var(--f-body);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px 0;border:1px solid var(--line);color:var(--ink-3);line-height:1.4}
.t-bio{color:#6fd39a;border-color:rgba(76,195,122,.45)}
.t-upg{color:var(--gold);border-color:rgba(181,143,82,.5)}
.t-fab{color:#8fd2f5;border-color:rgba(124,200,242,.45)}
.t-adv{color:#c3a4ff;border-color:rgba(180,140,255,.45)}
.t-link{color:#a9b3ff;border-color:rgba(143,157,255,.45)}
.t-slot{color:var(--ink-2);border-style:dashed}
.t-reach{color:#ffb38a;border-color:rgba(255,138,61,.45)}
button.chip2{background:transparent;cursor:help;font-family:var(--f-body)}
button.chip2:hover,button.chip2:focus-visible{background:rgba(255,255,255,.06)}
.wi.has-card{cursor:help;outline:0}
.wi.has-card .wn{text-decoration:underline dotted rgba(181,143,82,.5);text-underline-offset:3px}
.wi.has-card:focus-visible{box-shadow:inset 2px 0 0 var(--gold)}
.wi.lit{background:rgba(181,143,82,.10)!important;box-shadow:inset 2px 0 0 var(--gold)}
/* chrome tree */
:root{--k-cyber:#9fb3c8;--k-bio:#4cc37a;--k-adv:#b48cff;--k-worn:#b58f52;--k-chip:#8f9dff}
.cgrp .hb .gnote{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink-3);margin-left:auto;text-align:right}
.ctree,.nc{list-style:none;margin:0;padding:0}
.ctree > .nd + .nd{border-top:1px solid var(--line)}
.nrow{padding:7px 10px 7px 12px;position:relative}
.nrow::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;background:var(--kc,var(--line))}
.k-cyber{--kc:var(--k-cyber)}.k-bio{--kc:var(--k-bio)}.k-adv{--kc:var(--k-adv)}.k-worn{--kc:var(--k-worn)}.k-chip{--kc:var(--k-chip)}.k-upgrade{--kc:var(--gold-dim)}.k-enh{--kc:var(--k-adv)}
.nh{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.nh .kd{display:none}
.nc{margin:0 0 6px 18px;border-left:1px dashed var(--line)}
.nc > .nd > .nrow{padding-top:5px;padding-bottom:5px}
.nc .wn{font-size:15px}
.ws{margin:3px 0 0;font-size:13.5px;line-height:1.35;color:var(--ink-2)}
.cnt3{font-family:var(--f-num);font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.k-enh > .nrow{background:linear-gradient(90deg,rgba(180,140,255,.09),transparent 70%)}
.k-enh .wn{color:#d6c4ff;font-size:15px}
.up{color:var(--k-adv);font-weight:700;font-size:14px}
.wn2{font-family:var(--f-cond);font-size:15px;color:var(--ink-2)}
.golink{font:inherit;cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--gold);font-size:12.5px;font-weight:700;letter-spacing:.06em;padding:3px 9px;margin:5px 10px}
.golink.sm{margin:0 0 0 4px;padding:0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em}
.golink:hover{border-color:var(--gold);background:rgba(181,143,82,.1)}
.k-link{padding:2px 0}
.feeds{margin:4px 0 0;font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.feeds span{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-right:2px}
.pips{display:inline-flex;align-items:center;gap:5px;margin-left:auto;background:transparent;border:0;padding:0;cursor:help;font:inherit}
.pp{display:inline-flex;gap:3px}
.pp i{width:7px;height:7px;border:1px solid var(--frame);transform:rotate(45deg)}
.pp i.on{background:var(--gold);border-color:var(--gold)}
.pips b,.mrow b{font-family:var(--f-num);font-size:11px;color:var(--ink-2);font-weight:600}
.nrow.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,30%{background:rgba(180,140,255,.28)}100%{background:transparent}}
.bodyfig.genome img{filter:drop-shadow(0 0 2px rgba(180,140,255,.9)) drop-shadow(0 0 18px rgba(180,140,255,.55)) drop-shadow(0 0 30px rgba(0,0,0,.85))}
@media (prefers-reduced-motion:no-preference){ .bodyfig.genome img{animation:gene 3.2s ease-in-out infinite}
  @keyframes gene{0%,100%{filter:drop-shadow(0 0 2px rgba(180,140,255,.7)) drop-shadow(0 0 12px rgba(180,140,255,.35)) drop-shadow(0 0 30px rgba(0,0,0,.85))}50%{filter:drop-shadow(0 0 3px rgba(180,140,255,1)) drop-shadow(0 0 26px rgba(180,140,255,.65)) drop-shadow(0 0 30px rgba(0,0,0,.85))}} }
.zitem.z-adv{border-left-color:rgba(180,140,255,.5)}
.zitem.z-adv.on{border-left-color:var(--k-adv);background:rgba(120,80,200,.2)}
.zitem.z-gear{border-left-style:dashed}
.comp{display:flex;flex-direction:column;gap:7px}
.bar2{display:flex;height:9px;gap:2px}
.seg{min-width:4px}
.s-bio{background:var(--k-bio)}.s-adv{background:var(--k-adv)}.s-cyber{background:var(--k-cyber)}.s-worn{background:var(--k-worn)}
.keys{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink-2)}
.kk{display:inline-flex;align-items:center;gap:6px}
.kk i{width:9px;height:9px;display:inline-block}
.kk b{font-family:var(--f-num);font-size:12px;color:var(--ink)}
.meters{display:flex;flex-direction:column;gap:6px}
.meters .lab{margin:0}
.mrow{display:grid;grid-template-columns:1fr auto 38px;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--ink)}
.mrow em{font-style:normal;font-weight:500;font-size:12px;color:var(--ink-3);margin-left:8px}
.mrow b{text-align:right}
.card{position:fixed;z-index:60;width:390px;max-width:calc(100vw - 16px);max-height:min(78vh,640px);overflow-y:auto;background:rgba(12,9,8,.97);border:1px solid var(--frame);
  box-shadow:0 18px 40px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.6);padding:12px 14px 10px;font-size:14px;line-height:1.4;color:var(--ink-2);scrollbar-width:thin;scrollbar-color:var(--frame) transparent;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.card.pinned{border-color:var(--gold)}
.card.sheet{left:0!important;right:0;bottom:0;top:auto!important;width:auto;max-width:none;max-height:70vh;border-width:2px 0 0;clip-path:none;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.rc + .rc{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.rc h4{margin:0 22px 6px 0;font-family:var(--f-cond);font-size:19px;font-weight:600;color:var(--ink);line-height:1.1}
.rc .rk{font-family:var(--f-body);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid var(--frame);padding:1px 5px 0;vertical-align:3px}
.rmeta{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.rmeta span{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink-2);background:var(--cell);border:1px solid var(--line);padding:1px 6px 0}
.rmeta span:first-child{color:var(--gold);border-color:rgba(181,143,82,.45)}
.rfl{margin:0 0 8px;font-style:italic;color:var(--ink-3);font-size:13.5px}
.rrules p{margin:0 0 6px;color:var(--ink);font-style:italic}
.rrules ul{margin:0 0 6px;padding-left:16px}
.rrules li{margin:0 0 4px;color:var(--ink);font-style:italic}
.rsrc{margin:6px 0 0;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.rc > p{margin:0;color:var(--ink)}
.rclose{position:absolute;top:6px;right:8px;border:0;background:transparent;color:var(--ink-3);font-size:20px;line-height:1;cursor:pointer;padding:2px 6px}
.rclose:hover{color:var(--red-hi)}
.card:not(.pinned):not(.sheet) .rclose{display:none}
@media (hover:hover){ .wi:hover{background:rgba(209,28,40,.08)} }
textarea.ed{display:block;margin-top:4px;resize:vertical;font-size:13.5px;line-height:1.3}
.err{padding:40px 20px;text-align:center;color:var(--ink-2);letter-spacing:.1em}

/* ---------- ADVANCE (IP) ---------- */
.adv{--cc:#8d817b;display:grid;grid-template-columns:350px minmax(0,1fr);grid-template-rows:auto 1fr auto;grid-template-areas:"bal map" "det map" "plan plan";gap:12px;align-items:start}
.adv .c-role{--cc:var(--gold)}
.adv .c-fighting{--cc:var(--red-hi)}
.adv .a-bal{grid-area:bal}.adv .a-det{grid-area:det}.adv .a-map{grid-area:map}.adv .a-plan{grid-area:plan}
.adv.editing{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"bal" "map" "plan"}
.adv.editing .advbal{max-width:420px}

/* ledger */
.led{padding:14px 18px 16px;display:flex;flex-direction:column;gap:6px}
.lr{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.lr > span{font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.lr > b{display:flex;align-items:baseline;gap:6px;font-family:var(--f-num);font-weight:600;font-size:24px;line-height:1.1;color:var(--ink-2);font-variant-numeric:tabular-nums}
.lr > b i{font-style:normal;color:var(--red-hi)}
.lr > b .ed{width:120px;text-align:right;font-family:var(--f-num);font-size:20px}
.lr.tot{margin-top:8px;padding-top:12px;border-top:3px double var(--frame);align-items:flex-end}
.lr.tot > span{color:var(--gold);padding-bottom:6px}
.lr.tot > b{font-size:60px;line-height:.86;color:var(--gold);text-shadow:0 0 26px rgba(181,143,82,.28)}
.lr.tot.neg > b{color:var(--red-hi);text-shadow:none}

/* treemap */
.advmap .hb .seg{margin:-2px -4px -1px 0}
.advmap .seg button{padding:4px 12px;font-size:11px}
.tmap{position:relative;height:clamp(460px,43vw,650px);margin:8px}
.tm-c{position:absolute;border:1px solid rgba(255,255,255,.07);background:rgba(8,6,5,.4);transition:opacity .25s,border-color .25s}
.tm-c.on{border-color:var(--cc)}
.tm-c.dim{opacity:.4}
.tm-h{position:absolute;left:0;right:0;top:0;height:24px;display:flex;align-items:center;gap:8px;padding:0 14px 0 8px;background:#000;border:0;border-left:3px solid var(--cc);color:#fff;font:inherit;font-weight:700;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;text-align:left}
.tm-h::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 9px 9px 0;border-color:transparent var(--frame) transparent transparent}
.tm-h span{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tm-h b{font-family:var(--f-num);font-weight:600;font-size:12.5px;letter-spacing:.02em;color:var(--cc)}
.tm-h:hover span{color:var(--gold)}
.tm-t{position:absolute;display:flex;flex-direction:column;justify-content:space-between;gap:4px;padding:9px 11px 8px;overflow:hidden;text-align:left;
  background:rgba(28,23,22,.84);border:1px solid rgba(255,255,255,.07);color:var(--ink-2);cursor:pointer;font:inherit;
  transition:border-color .15s,background-color .15s,opacity .25s,filter .25s}
.tm-t:hover{border-color:var(--gold)}
.tm-t.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold),0 0 22px rgba(181,143,82,.3);z-index:2}
.tm-t.dim{opacity:.26;filter:saturate(.25)}
.tm-t.c-fighting{background:linear-gradient(160deg,rgba(159,12,23,.36),rgba(60,8,12,.62));border-color:rgba(209,28,40,.22)}
.tm-t.c-role{background:linear-gradient(160deg,rgba(181,143,82,.24),rgba(60,48,32,.5));border-color:rgba(181,143,82,.32)}
.tm-t.m-earth{background:linear-gradient(155deg,rgba(196,154,90,.3),rgba(60,8,12,.62) 72%)}
.tm-t.m-fire{background:linear-gradient(155deg,rgba(255,138,61,.3),rgba(60,8,12,.62) 72%)}
.tm-t.m-water{background:linear-gradient(155deg,rgba(79,159,224,.3),rgba(60,8,12,.62) 72%)}
.tm-t.m-air{background:linear-gradient(155deg,rgba(207,216,227,.22),rgba(60,8,12,.62) 72%)}
.tnm{position:relative;display:flex;flex-direction:column;min-width:0}
.tnm b{display:block;font-family:var(--f-cond);font-weight:600;font-size:15.5px;line-height:1.05;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnm small{font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tf{position:relative;display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.tc{margin-left:auto;font-family:var(--f-num);font-weight:600;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.tc small{font-size:10px;color:var(--ink-3);margin-left:3px;letter-spacing:.08em}
.c-role .tc{color:var(--gold)}
.tl{font-family:var(--f-num);font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.tl i{font-style:normal;margin:0 4px;color:var(--red-hi)}
.zL{padding:12px 14px 11px}
.zL .tnm{padding-right:30px}
.zL .tnm b{font-size:22px;white-space:normal}
.zL .tnm small{font-size:13.5px}
.zL .tc{font-size:25px}
.zL .tl{font-size:15px;color:var(--ink-2)}
.tk{position:absolute;top:12px;right:12px}
.zS{padding:4px 6px 4px;gap:1px}
.zS .tnm b{font-size:12.5px}
.zS .tc{font-size:11.5px}
.zXS{padding:0}
.tbr{position:absolute;right:-.04em;bottom:-.2em;font-family:var(--f-brush);line-height:1;opacity:.22;pointer-events:none}
.tmtip{position:fixed;z-index:70;pointer-events:none;background:rgba(12,9,8,.96);border:1px solid var(--frame);padding:6px 10px 5px;display:flex;flex-direction:column;gap:2px;max-width:280px}
.tmtip b{font-family:var(--f-cond);font-weight:600;font-size:15.5px;color:var(--ink)}
.tmtip span{font-family:var(--f-num);font-size:12px;color:var(--gold)}

/* kind chips + shared name block */
.kx{display:inline-block;flex:none;font-family:var(--f-num);font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--red-hi);border:1px solid rgba(209,28,40,.55);padding:0 4px;line-height:15px;vertical-align:2px}
.kx.kr{font-family:var(--f-body);font-weight:700;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border-color:rgba(181,143,82,.55)}
.an{display:flex;flex-direction:column;min-width:0}
.an b{display:flex;align-items:center;gap:7px;min-width:0;font-family:var(--f-cond);font-weight:600;font-size:16px;line-height:1.15;color:var(--ink)}
.an b span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.an small{font-size:12.5px;font-weight:600;color:var(--ink-3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dl{font-family:var(--f-num);font-size:13px;color:var(--ink-3);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.dl i{font-style:normal;color:var(--red-hi);margin:0 4px}

/* detail panel */
.advdet{min-height:280px}
.dback{display:inline-flex;align-items:center;gap:6px;margin:-2px -8px -1px auto;border:0;background:transparent;color:var(--gold);font:inherit;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:2px 8px}
.dback i{font-style:normal;font-size:13px}
.dback:hover{color:#fff}
.dcats{display:flex;flex-direction:column;padding:4px 0 6px}
.dcat{display:grid;grid-template-columns:minmax(0,1fr) 72px 56px 36px;column-gap:10px;align-items:center;padding:9px 16px 9px;background:transparent;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer;color:inherit;font:inherit}
.dcat:first-child{border-top:0}
.dcat:hover{background:rgba(255,255,255,.035)}
.dcat .dn{font-family:var(--f-cond);font-weight:600;font-size:17px;color:var(--ink)}
.dcat .dn em{font-style:normal;font-family:var(--f-num);font-size:11px;color:var(--ink-3);margin-left:8px}
.dcat > b{order:3;font-family:var(--f-num);font-weight:600;font-size:15.5px;text-align:right;color:var(--ink)}
.dcat .dbar{order:2}
.dcat .dp{order:4}
.c-fighting.dcat > b{color:var(--red-hi)}
.c-role.dcat > b{color:var(--gold)}
.dbar{height:4px;background:rgba(255,255,255,.06);position:relative}
.dbar i{position:absolute;left:0;top:0;bottom:0;background:var(--cc)}
.dp{font-family:var(--f-num);font-size:11px;color:var(--ink-3);text-align:right;min-width:34px}
.dhead{padding:14px 16px 12px;border-bottom:1px solid var(--line);box-shadow:inset 3px 0 0 var(--cc)}
.dbig{display:inline-flex;align-items:baseline;font-family:var(--f-num);font-weight:600;font-size:34px;line-height:1;color:var(--ink)}
.dbig small{font-size:12px;color:var(--ink-3);margin-left:5px;letter-spacing:.1em}
.dsub{display:block;font-size:13.5px;color:var(--ink-3);margin-top:5px}
.drows{display:flex;flex-direction:column;max-height:560px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--frame) transparent}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 62px 54px;gap:10px;align-items:center;padding:6px 16px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;color:inherit;font:inherit}
.drow:first-child{border-top:0}
.drow:hover{background:rgba(255,255,255,.035)}
.drow > b{font-family:var(--f-num);font-weight:600;font-size:15px;text-align:right;color:var(--ink)}
.ditem{position:relative;overflow:hidden;padding:14px 16px 13px;border-bottom:1px solid var(--line);box-shadow:inset 3px 0 0 var(--cc)}
.ditem.m-earth{background:linear-gradient(150deg,rgba(196,154,90,.14),transparent 60%)}
.ditem.m-fire{background:linear-gradient(150deg,rgba(255,138,61,.14),transparent 60%)}
.ditem.m-water{background:linear-gradient(150deg,rgba(79,159,224,.14),transparent 60%)}
.ditem.m-air{background:linear-gradient(150deg,rgba(207,216,227,.1),transparent 60%)}
.dbr{position:absolute;right:-4px;bottom:-26px;font-family:var(--f-brush);font-size:150px;line-height:1;opacity:.17;pointer-events:none}
.dk{position:relative;display:flex;gap:8px;align-items:center;min-height:17px;margin-bottom:6px}
.dkn{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.dname{position:relative;display:flex;flex-direction:column}
.dname b{font-family:var(--f-cond);font-weight:600;font-size:32px;line-height:1;color:var(--ink)}
.dname small{font-size:14.5px;font-weight:600;color:var(--ink-3);margin-top:4px;letter-spacing:.03em}
.dmain{position:relative;display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:14px}
.dlv{font-family:var(--f-num);font-size:22px;color:var(--ink-2)}
.dlv i{font-style:normal;color:var(--red-hi);margin:0 7px}
.dlog{position:relative;margin:9px 0 0;font-size:13px;color:var(--ink-3)}
.dnote{color:var(--gold)}
.advmap .hb .gsp{margin-left:0;margin-right:12px;font-family:var(--f-num);color:var(--gold)}
.drl{margin:12px 16px 6px}
.rcpt{list-style:none;margin:0 16px 14px;padding:0;font-size:14px}
.rcpt li{display:flex;align-items:baseline;gap:8px;padding:2px 0;color:var(--ink-2)}
.rcpt li i{flex:1;border-bottom:1px dotted #4a403c;transform:translateY(-4px)}
.rcpt li b{font-family:var(--f-num);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.rcpt li.t{margin-top:5px;padding-top:7px;border-top:1px solid var(--frame)}
.rcpt li.t span{font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.rcpt li.t i{border:0}
.rcpt li.t b{color:var(--gold);font-weight:600;font-size:15px}
.dnow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--line)}
.dnow > div{display:flex;flex-direction:column;gap:3px;padding:10px 16px 11px}
.dnow > div + div{border-left:1px solid var(--line)}
.dnow b{font-family:var(--f-num);font-weight:600;font-size:17px;color:var(--ink)}
.dnx em{font-style:normal;font-size:13px;color:var(--ink-3)}
.dnx.ok b,.dnx.ok em{color:var(--gold)}
.dnx.max b{color:var(--ink-3)}
.dplan{margin:0;padding:10px 16px 12px;border-top:1px solid var(--line);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dplan b{font-family:var(--f-num);font-weight:600;font-size:16px;color:var(--ink)}
.dplan b i{font-style:normal;color:var(--red-hi);margin:0 4px}
.dplan em{font-style:normal;font-size:13px;color:var(--ink-3)}

/* list view */
.alist{columns:2 380px;column-gap:0;padding:4px 0 10px}
.lcat{break-inside:avoid;padding:4px 0 8px}
.lcat h3,.pcat h3{margin:0;display:flex;align-items:baseline;gap:8px;padding:10px 16px 6px 13px;border-left:3px solid var(--cc);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.lcat h3 b,.pcat h3 b{margin-left:auto;font-family:var(--f-num);font-size:13px;letter-spacing:.02em;color:var(--cc)}
.lrow2{display:grid;grid-template-columns:minmax(0,1fr) 60px 86px 50px;gap:10px;align-items:center;width:100%;padding:5px 16px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;color:inherit;font:inherit}
.lrow2:hover{background:rgba(255,255,255,.035)}
.lrow2.sel,.drow.sel{background:rgba(181,143,82,.1);box-shadow:inset 2px 0 0 var(--gold)}
.lrow2 > b{font-family:var(--f-num);font-weight:600;font-size:14.5px;text-align:right;color:var(--ink)}
.lb{height:4px;background:rgba(255,255,255,.06);position:relative}
.lb i{position:absolute;left:0;top:0;bottom:0;background:var(--cc)}

/* training plan */
.plbody{display:grid;grid-template-columns:minmax(0,1fr) 350px;grid-template-rows:auto 1fr;grid-template-areas:"cols sum" "cols ref"}
.pcols{grid-area:cols}.psum{grid-area:sum}.pref{grid-area:ref}
.psum{display:flex;flex-direction:column;gap:4px;padding:18px 18px 16px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(0,0,0,.18)}
.psum .lab{margin:0 0 4px}
.psum .dbig{font-size:40px}
.psum .pkey{margin-top:10px}
.pcols{columns:3 250px;column-gap:18px;padding:6px 16px 14px}
.pcat{padding-top:6px;margin-bottom:8px}
.pcat h3{break-after:avoid}
.prow{break-inside:avoid}
.pcat h3{padding:8px 0 6px 10px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n l" "x f";gap:3px 10px;padding:7px 0 7px 10px;border-top:1px solid var(--line)}
.prow .an{grid-area:n}
.prow .dl{grid-area:l;font-size:15px;color:var(--ink-2)}
.pnx{grid-area:x;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink-3)}
.pnx i{width:6px;height:6px;flex:none;background:var(--line);transform:rotate(45deg)}
.pnx b{font-family:var(--f-num);font-weight:600;color:var(--ink-2)}
.prow.ok .pnx{color:var(--ink-2)}
.prow.ok .pnx i{background:var(--gold);box-shadow:0 0 6px rgba(181,143,82,.9)}
.prow.ok .pnx b{color:var(--gold)}
.plf{grid-area:f;align-self:center;font-family:var(--f-num);font-size:12px;color:var(--ink-3);text-align:right;white-space:nowrap}
.pnone{margin:14px 0;color:var(--ink-3)}
.pref{display:flex;flex-direction:column;gap:12px;padding:16px 18px;border-left:1px solid var(--line);background:rgba(0,0,0,.18)}
.pref .lab{margin:0}
.iptab{border-collapse:collapse;width:100%;font-family:var(--f-num);font-size:12px;font-variant-numeric:tabular-nums}
.iptab th{font-weight:600;color:var(--ink-3);padding:3px 1px 4px;text-align:center}
.iptab tbody th{text-align:left;font-family:var(--f-body);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;padding-right:8px;color:var(--ink-2)}
.iptab td{text-align:center;padding:5px 1px;color:var(--ink-2);border-top:1px solid var(--line)}
.rnote{margin:0;font-size:13.5px;line-height:1.35;color:var(--ink-2)}
.rnote span{display:block;margin-top:3px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.pkey{margin:0;display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink-2)}
.pkey i{width:6px;height:6px;flex:none;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 6px rgba(181,143,82,.9)}

/* edit */
.advedit .erow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.4fr) 128px 104px 56px 56px 64px 22px;gap:8px;align-items:end;padding:6px 12px 7px;border-top:1px solid var(--line)}
.advedit .erow.plan{grid-template-columns:minmax(0,1.2fr) minmax(0,1.4fr) 128px 104px 56px 56px 22px}
.advedit .erow.meta{grid-template-columns:120px;border-top:0}
.advedit .erow{padding:3px 12px}
.advedit .erow.ehead{padding:8px 12px 4px;border-top:0;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.advedit .erow.meta{padding:8px 12px}
.advedit .erow:not(.meta) label .u{display:none}
.advedit label{display:flex;flex-direction:column;gap:2px;min-width:0}
.advedit .ed{width:100%;padding:3px 6px}
.advedit .x{align-self:center}

@media (prefers-reduced-motion:no-preference){
  .tmap.anim .tm-c{animation:tmfade .35s ease both}
  .tmap.anim .tm-t{animation:tmin .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d)}
  @keyframes tmfade{from{opacity:0}}
  @keyframes tmin{from{opacity:0;transform:scale(.88);filter:brightness(2.2) saturate(0)}}
  .advdet > *{animation:tmfade .25s ease both}
}
@media (max-width:1240px){
  .adv{grid-template-columns:300px minmax(0,1fr)}
  .plbody{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"sum" "cols" "ref"}
  .psum{border-left:0}
  .pref{border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start;column-gap:24px}
  .pref .lab,.pref .iptab{grid-column:1}
  .pref .rnote,.pref .pkey{grid-column:2}
  .pref .rnote{grid-row:1 / span 2}
}
@media (max-width:900px){
  .adv{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"bal" "map" "det" "plan"}
  .led{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.15fr);gap:0;padding:0}
  .lr{flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:5px;padding:12px 14px}
  .lr + .lr{border-left:1px solid var(--line)}
  .lr.tot{margin:0;padding-top:12px;border-top:0;align-items:flex-start}
  .lr.tot > span{padding:0}
  .lr > b{font-size:20px}
  .lr.tot > b{font-size:36px}
  .tmap{height:540px}
  .pref{display:flex}
  .advedit .erow,.advedit .erow.plan{grid-template-columns:repeat(4,minmax(0,1fr));padding:8px 12px;border-top:1px solid var(--frame)}
  .advedit .erow label{grid-column:span 2}
  .advedit .erow label.n{grid-column:span 1}
  .advedit .erow.meta{grid-template-columns:120px}
  .advedit .erow.meta label{grid-column:auto}
  .advedit .x{justify-self:end;align-self:end;padding-bottom:4px}
  .advedit .erow.ehead{display:none}
  .advedit .erow:not(.meta) label .u{display:block}
  .advedit .erow label.n{grid-column:auto}
}
@media (max-width:600px){
  .tmap{height:600px;margin:6px}
  .lr{padding:10px 10px}
  .lr > span{font-size:10.5px;letter-spacing:.14em}
  .lr > b{font-size:17px}
  .lr.tot > b{font-size:30px}
  .lrow2{grid-template-columns:minmax(0,1fr) 54px 44px}
  .lrow2 .lb{display:none}
  .alist{columns:1}
  .pcols{columns:1}
  .psum .dbig{font-size:34px}
  .iptab{font-size:11px}
  .iptab tbody th{padding-right:4px;font-size:10px}
  .dname b{font-size:28px}
}

/* column headings sit exactly over their columns: same widths, no gaps, no right padding */
.box:has(> .sk) > .hb,.box:has(> .tbl-wrap > .t) > .hb{gap:0;padding-right:0}
.box:has(> .sk) > .hb .sp,.box:has(> .tbl-wrap > .t) > .hb .sp{margin-right:8px}
.box:has(> .sk) > .hb .c{width:34px;flex:none}
.box:has(> .tbl-wrap > .t) > .hb .c{width:48px;flex:none}
.t td.n{width:48px;min-width:48px;max-width:48px;padding-left:2px;padding-right:2px}
.t td.name{overflow-wrap:anywhere}
.box.arm > .hb .c{width:38px!important}
.box.arm .t td.n{width:38px;min-width:38px;max-width:38px}

/* posse hero: opens zoomed on the upper body; tap the art to see the full figure */
.phero{overflow:hidden;cursor:zoom-out}
.phero.full{cursor:zoom-in}
.pz{--z:1.85;position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-end;transform-origin:50% 2%;transform:scale(var(--z));transition:transform .7s cubic-bezier(.2,.7,.2,1);
  -webkit-mask-image:linear-gradient(#000 38%,transparent 56%);mask-image:linear-gradient(#000 38%,transparent 56%)}
.phero.duo .pz{--z:1.22;transform-origin:50% 0;-webkit-mask-image:linear-gradient(#000 62%,transparent 80%);mask-image:linear-gradient(#000 62%,transparent 80%)}
.phero.full .pz{transform:scale(1);-webkit-mask-image:none;mask-image:none}
.pzh{position:absolute;right:12px;bottom:10px;z-index:2;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);background:rgba(8,6,5,.7);padding:3px 8px 2px;pointer-events:none}
@media (max-width:760px){ .phero{position:relative} }
@media (prefers-reduced-motion:no-preference){
  .phero:not(.full) .pz{animation:pzoom 1s cubic-bezier(.25,.7,.2,1) both .12s}
  @keyframes pzoom{from{transform:scale(1);-webkit-mask-image:none;mask-image:none}}
}


/* dossier: Training Area (No Place Like Home) */
.pract .hb{padding:0 10px 0 0}
.pract .prtog{flex:1;display:flex;align-items:center;gap:8px;background:none;border:0;color:inherit;font:inherit;text-align:left;padding:3px 0 3px 10px;cursor:pointer;letter-spacing:inherit;text-transform:inherit}
.pract .prtog .chev{font-size:9px;color:var(--red-hi);transition:transform .2s}
.pract .prtog[aria-expanded="true"] .chev{transform:rotate(90deg)}
.prstate{margin-left:auto;font-family:var(--f-num);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:1px 7px 0;border:1px solid var(--line);color:var(--ink-3)}
.prstate.on{color:#000;background:var(--gold);border-color:var(--gold)}
.prbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}
.prsw{display:flex;align-items:center;gap:10px;background:none;border:1px solid var(--line);color:var(--ink-2);font:600 13px/1 var(--f-body,inherit);letter-spacing:.12em;text-transform:uppercase;padding:7px 10px;cursor:pointer;align-self:flex-start}
.prsw i{width:30px;height:14px;border:1px solid var(--frame);position:relative;background:#000}
.prsw i::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:8px;background:var(--ink-3);transition:left .18s,background .18s}
.prsw[aria-pressed="true"]{color:var(--gold);border-color:var(--frame)}
.prsw[aria-pressed="true"] i::after{left:16px;background:var(--gold)}
.prsw:disabled{cursor:default;opacity:.7}
.prule{margin:0;font-size:13px;line-height:1.35;color:var(--ink-3);font-style:italic}
.prule b{font-style:normal;color:var(--ink-2);font-weight:600}
.prlab{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.prlab em{font-style:normal;font-family:var(--f-num);color:var(--gold);letter-spacing:.06em}
.prgrid{display:flex;flex-wrap:wrap;gap:5px}
.prc{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.45);border:1px solid var(--line);color:var(--ink-2);font:500 14px/1 var(--f-name,inherit);padding:6px 8px 5px;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.prc:hover:not(:disabled){border-color:var(--frame);color:var(--ink)}
.prc.on{border-color:var(--gold);color:var(--ink);background:rgba(181,143,82,.14)}
.prc.on::after{content:"+1";font-family:var(--f-num);font-size:11px;font-weight:600;color:var(--gold)}
.prc:disabled{cursor:default;opacity:.38}
.prc.on:disabled{opacity:1}
.prsub{flex-basis:100%;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.prnone{font-size:13px;color:var(--ink-3)}
.sk tr.practiced td:nth-child(2){color:var(--gold);font-weight:700}
.sk tr.practiced td:nth-child(2) .dec{color:var(--gold)}
.sk tr.practiced td:first-child{box-shadow:inset 2px 0 0 var(--gold)}
.sk tr.practiced td:nth-child(2),.sk tr.practiced td.base{text-shadow:0 0 7px currentColor,0 0 2px currentColor}
.sk tr.master td:nth-child(2),.sk tr.master td:nth-child(2) .dec{color:var(--mc)!important}

/* loadout: Trauma Team card v5. Cyberpunk ID card, original layout and emblem */
.ttwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.ttfit{width:100%;display:flex;justify-content:center}
.ttc{--w:min(100%,460px);--cut:polygon(5.5cqw 0,100% 0,100% calc(100% - 5.5cqw),calc(100% - 5.5cqw) 100%,0 100%,0 5.5cqw);text-align:left;position:relative;width:var(--w);aspect-ratio:1.6/1;perspective:1400px;cursor:pointer;container-type:inline-size;border:0;padding:0;background:none;color:inherit;font:inherit;display:block}
@media (min-width:1321px){
  .lo > .stack{align-self:stretch}
  .ttwrap{flex:1 1 0;min-height:170px;contain:size}
  .ttfit{flex:1 1 0;min-height:0;container-type:size;align-items:center}
  .ttc{--w:min(100cqw,calc(100cqh * 1.6),460px)}
}
.ttflip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.ttc.back .ttflip{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.ttflip{transition:none}}
.ttface{position:absolute;inset:0;clip-path:var(--cut);backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:linear-gradient(160deg,#141212,#080707 55%,#0e0c0c)}
.ttface.b{transform:rotateY(180deg)}
.ttface::after{content:"";position:absolute;inset:0;padding:.35cqw;clip-path:var(--cut);background:linear-gradient(135deg,#5a1016,#2a2424 30%,#3a3232 70%,#6b1219);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.ttcirc{position:absolute;inset:0;width:100%;height:100%;color:#3b3434;pointer-events:none}
.ttscan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 .25cqw,transparent .25cqw .7cqw)}
/* header bar */
.tthd{position:absolute;left:0;right:0;top:0;height:18%;display:flex;align-items:center;gap:2.6cqw;padding:0 4cqw 0 7cqw;background:linear-gradient(90deg,#9f0c17,#d11c28 55%,#9f0c17);clip-path:polygon(5.5cqw 0,100% 0,100% 100%,0 100%,0 5.5cqw)}
.tthd::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.5cqw;background:#000;opacity:.35}
.tthd b{font:700 6.2cqw/1 var(--f-disp);letter-spacing:.06em;color:#fff;white-space:nowrap}
.tthd small{margin-left:auto;font:700 1.9cqw/1.25 var(--f-num);letter-spacing:.14em;color:rgba(255,255,255,.85);text-align:right;white-space:nowrap}
.tthaz{position:absolute;right:0;top:18%;width:14cqw;height:2.2cqw;background:repeating-linear-gradient(-45deg,#d11c28 0 1.1cqw,#0a0808 1.1cqw 2.2cqw)}
/* body */
.ttbd{position:absolute;left:0;right:0;top:18%;bottom:0;padding:4cqw 5cqw 3.4cqw 5cqw;display:grid;grid-template-columns:17cqw minmax(0,1fr) 17cqw;grid-template-rows:1fr auto;column-gap:3.6cqw}
.ttmark{width:17cqw;height:17cqw;align-self:start}
.ttemb{display:flex;flex-direction:column;gap:1.4cqw}
.ttemb span{font:700 1.8cqw/1 var(--f-num);letter-spacing:.16em;color:#8a8080;text-align:center}
.ttemb em{font:700 3cqw/1 var(--f-disp);font-style:normal;letter-spacing:.14em;color:#fff;background:#d11c28;text-align:center;padding:.9cqw 0 .7cqw;text-transform:uppercase}
.ttc.t-executive .ttemb em{font-size:2.3cqw;letter-spacing:.08em;background:linear-gradient(90deg,#b58f52,#f3d58e,#b58f52);color:#140f0e}
.ttdata{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.1cqw 1.8cqw;align-content:start;font:600 2.35cqw/1.2 var(--f-num);letter-spacing:.04em}
.ttdata dt{color:#7d7474;letter-spacing:.14em}
.ttdata dt::after{content:" /"}
.ttdata dd{margin:0;color:#ece6e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.ttdata dd.red{color:#ff4a55}
.ttdata dd.big{font:700 3cqw/1.05 var(--f-disp);letter-spacing:.02em;color:#fff;text-transform:none}
.ttret{position:relative;align-self:start;height:17cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8cqw}
.ttret::before{content:"";position:absolute;inset:0;background:
  linear-gradient(#d11c28,#d11c28) 0 0/3.2cqw .45cqw,linear-gradient(#d11c28,#d11c28) 0 0/.45cqw 3.2cqw,linear-gradient(#d11c28,#d11c28) 100% 0/3.2cqw .45cqw,linear-gradient(#d11c28,#d11c28) 100% 0/.45cqw 3.2cqw,
  linear-gradient(#d11c28,#d11c28) 0 100%/3.2cqw .45cqw,linear-gradient(#d11c28,#d11c28) 0 100%/.45cqw 3.2cqw,linear-gradient(#d11c28,#d11c28) 100% 100%/3.2cqw .45cqw,linear-gradient(#d11c28,#d11c28) 100% 100%/.45cqw 3.2cqw;background-repeat:no-repeat}
.ttret::after{content:"";position:absolute;left:50%;top:50%;width:1.2cqw;height:1.2cqw;transform:translate(-50%,-50%);border:.25cqw solid rgba(209,28,40,.4);border-radius:50%;opacity:.0}
.ttret small{font:700 1.7cqw/1 var(--f-num);letter-spacing:.22em;color:#8a8080}
.ttret b{font:700 8cqw/.9 var(--f-num);color:#fff;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ttret b.due{color:#ff4a55}
.ttbar{grid-column:1 / 4;display:flex;align-items:flex-end;gap:3cqw;margin-top:2.6cqw}
.ttbar .bc{flex:1;height:6.4cqw;fill:#ece6e0}
.ttser{flex:none;font:600 1.45cqw/1.4 var(--f-num);letter-spacing:.08em;color:#8a8080;white-space:nowrap}
.ttser b{color:#ece6e0;font-weight:600}
.ttrail{position:absolute;right:1.5cqw;top:24%;bottom:14%;width:1.2cqw;background:repeating-linear-gradient(180deg,#5a5050 0 .4cqw,transparent .4cqw 1.4cqw)}
/* back: terminal readout */
.ttbk{position:absolute;inset:0;padding:6cqw 6cqw 4.6cqw 7cqw;display:grid;grid-template-columns:minmax(0,1fr) 22cqw;column-gap:4.4cqw}
.ttterm{font:600 2.3cqw/1.55 var(--f-num);color:#d9d1ca;letter-spacing:.03em;min-width:0}
.ttterm .h{color:#ff4a55;letter-spacing:.14em;margin-bottom:1cqw}
.ttterm .ttkv{display:grid;grid-template-columns:14cqw minmax(0,1fr);column-gap:1.6cqw}
.ttterm .ttkv span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttterm i{font-style:normal;color:#7d7474}
.ttterm .cur::after{content:"_";color:#ff4a55}
.ttqr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4cqw}

  /* Skills follow the stats: STAT is the current value of the stat named in the row (or its group,
     e.g. "Language (INT)", "Martial Arts [x2] [DEX]"), and BASE = MOD + LVL + STAT. Rows with no stat stay as typed. */
  var STAT_TAG = /[\(\[](INT|REF|DEX|TECH|COOL|WILL|LUCK|MOVE|BODY|EMP)[\)\]]/;
  function deriveSkills(){
    var sv = {}; (S.stats || []).forEach(function(s){ sv[s.k] = +s.v || 0; if (s.k === "EMP" && nyoziOn() && s.max != null && +s.max > 0) sv.EMP = +s.max; });
    var PR = practicedSet();
    function fix(x, inherited){
      var m = String(x.name || "").match(STAT_TAG), k = m ? m[1] : inherited;
      if (!k || sv[k] == null) return;
      x.stat = sv[k];
      var mod = (+x.mod || 0) + (PR[x.name] ? 1 : 0), lvl = +x.lvl || 0;
      x.base = mod + lvl + x.stat;
    }
    (S.skills || []).forEach(function(col){ col.forEach(function(sec){
      var parent = "";
      (sec.rows || []).forEach(function(r){
        var m = String(r.name || "").match(STAT_TAG);
        if (r.items){ r.items.forEach(function(it){ fix(it, m ? m[1] : ""); }); return; }
        if (r.sub){ parent = m ? m[1] : ""; return; }
        fix(r, parent);

    }); });
  }

    rim.addColorStop(0,"rgba(181,143,82,0)"); rim.addColorStop(.45,"rgba(181,143,82,"+(.2*pulse)+")"); rim.addColorStop(.6,"rgba(160,30,30,.09)"); rim.addColorStop(1,"rgba(160,30,30,0)");
    ctx.beginPath(); ctx.arc(cx, cy, R*1.03, 0, 6.2832); ctx.fillStyle = rim; ctx.fill();
    ctx.save(); ctx.translate(cx, cy - R*.72); ctx.rotate(-0.12 + (still ? 0 : .02*Math.sin(t/1000*.03)));

    ctx.strokeStyle = "rgba(107,84,49,.22)"; ctx.lineWidth = 1; ctx.stroke();
    /* a small station gliding along the ring */
    if (!still){
      var ang = Math.PI*1.04 + ((t/1000*.004) % 1) * Math.PI*.92;
      ctx.globalAlpha = .7; ctx.fillStyle = "#e9d7b0";

  }
  var last = 0;
  function loop(t){ if (t - last > 33){ draw(t); last = t; } requestAnimationFrame(loop); }
  build();
  nextShoot = 6000;
  if (still) draw(0); else requestAnimationFrame(loop);
  var to; window.addEventListener("resize", function(){ clearTimeout(to); to = setTimeout(function(){ build(); fcan = null; if (still) draw(0); }, 120); });
})();
